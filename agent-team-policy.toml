# Managed model aliases and role files. Service tier lives in global config.toml.
version = 2

[models."gpt-5.6-luna"]
alias = "luna"

[models."gpt-5.6-sol"]
alias = "sol"

[roles."default"]
filename = "default.toml"

[roles."explorer"]
filename = "explorer.toml"

[roles."monitor"]
filename = "monitor.toml"

[roles."reviewer"]
filename = "reviewer.toml"

[roles."worker"]
filename = "worker.toml"

[roles."worker_max"]
filename = "worker-max.toml"

[roles."sol_xhigh"]
filename = "sol-xhigh.toml"
