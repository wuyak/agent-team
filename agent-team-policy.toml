# Single source of truth for managed native-agent runtime profiles.
version = 1

# Distribution template: initialize both histories during installation.
# See README.md. Scripts require one initial row per model and role.
service_tier_history = []
role_runtime_history = []

[models."gpt-5.6-luna"]
alias = "luna"
service_tier = "standard"

[models."gpt-5.6-sol"]
alias = "sol"
service_tier = "standard"

[roles.default]
filename = "default.toml"
model = "gpt-5.6-luna"
reasoning_effort = "high"
sandbox_mode = "inherit"

[roles.explorer]
filename = "explorer.toml"
model = "gpt-5.6-luna"
reasoning_effort = "medium"
sandbox_mode = "read-only"

[roles.monitor]
filename = "monitor.toml"
model = "gpt-5.6-luna"
reasoning_effort = "medium"
sandbox_mode = "read-only"

[roles.reviewer]
filename = "reviewer.toml"
model = "gpt-5.6-luna"
reasoning_effort = "high"
sandbox_mode = "read-only"

[roles.worker]
filename = "worker.toml"
model = "gpt-5.6-luna"
reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"

[roles.worker_max]
filename = "worker-max.toml"
model = "gpt-5.6-luna"
reasoning_effort = "max"
sandbox_mode = "workspace-write"

[roles.worker_xhigh]
filename = "worker-xhigh.toml"
model = "gpt-5.6-sol"
reasoning_effort = "xhigh"
sandbox_mode = "workspace-write"
